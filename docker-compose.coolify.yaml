services:
  herdr-mcp:
    build: .
    expose:
      - "8765"
    # herdr's socket is mode 0600, so the container runs as the socket owner's uid.
    user: "${HERDR_UID:?}:${HERDR_GID:?}"
    volumes:
      # Coolify treats a variable source without a default path as a bind only in long syntax.
      - type: bind
        source: ${HERDR_CONFIG_DIR:-}
        target: /herdr
        read_only: true
      # The history directory must be writable by HERDR_UID:HERDR_GID.
      - type: bind
        source: ${HERDR_MCP_DATA_DIR:-}
        target: /data
    environment:
      HERDR_MCP_TOKEN: ${HERDR_MCP_TOKEN:?}
      HERDR_MCP_PUBLIC_HOST: ${HERDR_MCP_PUBLIC_HOST:?}
      # herdr-mcp ignores this entry. It makes Compose reject an empty bind source.
      HERDR_CONFIG_DIR: "${HERDR_CONFIG_DIR:?Set HERDR_CONFIG_DIR}"
      HERDR_MCP_DATA_DIR: "${HERDR_MCP_DATA_DIR:?Set HERDR_MCP_DATA_DIR}"
